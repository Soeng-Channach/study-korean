<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Offline-ready TOPIK II Korean grammar, reading, vocabulary quizzes, mock tests, and progress tracking."
    />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>TOPIK II Korean Learning</title>
    <script>
      // Apply the saved (or system) theme before first paint so dark-mode
      // users never see a flash of the light shell while React boots.
      (function () {
        try {
          var stored = localStorage.getItem('topik-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0f172a' : '#f8fafc');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
